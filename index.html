<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pomodoro Timer - 4 Background Timers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #667eea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .timer-card {
      max-width: 650px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      text-align: center;
    }

    /* Mode Selector - Original with added All button */
    .mode-selector {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: #f0f2f5;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      color: #4a5568;
    }

    .mode-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: #667eea;
      color: white;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    /* Timer Display */
    .timer-circle {
      text-align: center;
      margin: 1rem 0;
    }

    .timer-digits {
      font-size: 5rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      background: #667eea;
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 80px;
      color: white;
      letter-spacing: 4px;
      transition: all 0.3s ease;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: #f2f5f9;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #1f2e3a;
      font-size: 1rem;
      justify-content: center;
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    .icon-btn:hover {
      background: #e6edf4;
      transform: scale(0.97);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Mini Status Bar - Shows all 4 timers status */
    .status-bar {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 1rem 0;
      padding: 0.8rem;
      background: #f9fbfd;
      border-radius: 1rem;
      border: 1px solid #eef2f6;
      flex-wrap: wrap;
    }

    .status-item {
      flex: 1;
      text-align: center;
      padding: 0.3rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .status-item:hover {
      background: #eef2f6;
    }

    .status-item.session { border-left: 3px solid #667eea; }
    .status-item.shortBreak { border-left: 3px solid #48bb78; }
    .status-item.longBreak { border-left: 3px solid #ed8936; }
    .status-item.custom { border-left: 3px solid #9f7aea; }

    .status-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #4a5568;
    }

    .status-time {
      font-size: 0.85rem;
      font-family: monospace;
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 5px;
    }
    .status-badge.running { background: #48bb78; box-shadow: 0 0 4px #48bb78; }
    .status-badge.paused { background: #ed8936; }
    .status-badge.idle { background: #a0aec0; }

    /* Tasks Section */
    .tasks-section {
      margin-top: 2rem;
      border-top: 2px solid #edeff4;
      padding-top: 1.5rem;
    }

    .tasks-header {
      margin-bottom: 1rem;
      text-align: left;
    }

    .tasks-header h3 {
      font-size: 1.2rem;
      color: #1f2b36;
    }

    .task-input-container {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .task-input-field {
      flex: 1;
      min-width: 150px;
      padding: 0.7rem 1rem;
      border: 1px solid #cfdee9;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .task-input-field:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .add-task-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .add-task-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    .task-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .task-item {
      background: #f9fbfd;
      border-radius: 0.8rem;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #eef2f6;
    }

    .task-check {
      width: 1.2rem;
      height: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      padding: 0.2rem 0;
      font-family: inherit;
      color: #1a2c38;
      text-align: left;
    }

    .task-text:focus {
      outline: none;
      border-bottom: 1px dashed #667eea;
    }

    .task-completed .task-text {
      text-decoration: line-through;
      color: #8ba0ae;
    }

    .delete-task {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #9aaebf;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .delete-task:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .empty-tasks {
      padding: 1.5rem;
      text-align: center;
      color: #93a9bb;
      font-size: 0.85rem;
      background: #fbfdff;
      border-radius: 0.8rem;
      border: 1px dashed #dce5ec;
    }

    /* Settings Modal */
    .settings-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .settings-modal {
      background: white;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-modal-header h2 {
      font-size: 1.3rem;
      color: #1f2b36;
    }

    .settings-close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #93a9bb;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .settings-close-btn:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .settings-modal-body {
      padding: 1.5rem;
    }

    .settings-group {
      margin-bottom: 1.8rem;
    }

    .settings-group h3 {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .settings-row label {
      font-weight: 500;
      color: #2d3748;
      font-size: 0.9rem;
      min-width: 140px;
    }

    .settings-row input {
      width: 100px;
      padding: 0.5rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-row input[type="color"] {
      width: 70px;
      height: 40px;
      cursor: pointer;
    }

    .settings-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #edeff4;
      display: flex;
      justify-content: flex-end;
    }

    .settings-save-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .settings-save-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .action-buttons {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
      }
      .icon-btn {
        width: 100%;
        justify-content: center;
      }
      .timer-digits {
        font-size: 3rem;
        padding: 0.3rem 1rem;
      }
      .status-bar {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="timer-card">
      <!-- Mode Selector with ALL button -->
      <div class="mode-selector">
        <button class="mode-btn" data-mode="session">Session</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
        <button class="mode-btn" data-mode="custom">Custom</button>
        <button class="mode-btn" data-mode="all">All</button>
      </div>

      <!-- Main Timer Display -->
      <div class="timer-circle">
        <div class="timer-digits" id="timerDisplay">25:00</div>
      </div>

      <!-- Status Bar - Shows all 4 timers -->
      <div class="status-bar">
        <div class="status-item session" data-status="session">
          <div class="status-label">🍅 Session <span class="status-badge" id="sessionBadge"></span></div>
          <div class="status-time" id="sessionStatusTime">25:00</div>
        </div>
        <div class="status-item shortBreak" data-status="shortBreak">
          <div class="status-label">🌿 Short Break <span class="status-badge" id="shortBreakBadge"></span></div>
          <div class="status-time" id="shortBreakStatusTime">05:00</div>
        </div>
        <div class="status-item longBreak" data-status="longBreak">
          <div class="status-label">☕ Long Break <span class="status-badge" id="longBreakBadge"></span></div>
          <div class="status-time" id="longBreakStatusTime">15:00</div>
        </div>
        <div class="status-item custom" data-status="custom">
          <div class="status-label">⚙ Custom <span class="status-badge" id="customBadge"></span></div>
          <div class="status-time" id="customStatusTime">30:00</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="icon-btn" id="playPauseBtn">
          <span class="btn-icon">▶</span>
          <span id="playPauseText">Start</span>
        </button>
        <button class="icon-btn" id="resetBtn">
          <span class="btn-icon">⟳</span>
          <span>Reset</span>
        </button>
        <button class="icon-btn" id="settingsBtn">
          <span class="btn-icon">⚙</span>
          <span>Settings</span>
        </button>
      </div>

      <!-- Tasks Section -->
      <div class="tasks-section">
        <div class="tasks-header">
          <h3>Tasks</h3>
        </div>
        <div class="task-input-container">
          <input type="text" id="taskInput" placeholder="Enter a new task..." class="task-input-field">
          <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
        </div>
        <ul class="task-list" id="taskListContainer">
          <li class="empty-tasks">No tasks yet — add something to focus on</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsOverlay" class="settings-overlay">
    <div class="settings-modal">
      <div class="settings-modal-header">
        <h2>Settings</h2>
        <button class="settings-close-btn">&times;</button>
      </div>
      <div class="settings-modal-body">
        <div class="settings-group">
          <h3>Timer Duration (minutes)</h3>
          <div class="settings-row">
            <label>Session Time:</label>
            <input type="number" id="sessionTime" min="1" max="99" value="25">
          </div>
          <div class="settings-row">
            <label>Short Break:</label>
            <input type="number" id="shortBreakTime" min="1" max="99" value="5">
          </div>
          <div class="settings-row">
            <label>Long Break:</label>
            <input type="number" id="longBreakTime" min="1" max="99" value="15">
          </div>
          <div class="settings-row">
            <label>Custom Time:</label>
            <input type="number" id="customTime" min="1" max="99" value="30">
          </div>
        </div>

        <div class="settings-group">
          <h3>Timer Colors</h3>
          <div class="settings-row">
            <label>Timer Text Color:</label>
            <input type="color" id="timerTextColor" value="#ffffff">
          </div>
          <div class="settings-row">
            <label>Timer Background:</label>
            <input type="color" id="timerBgColor" value="#667eea">
          </div>
        </div>

        <div class="settings-group">
          <h3>Button Colors</h3>
          <div class="settings-row">
            <label>Primary Button Color:</label>
            <input type="color" id="primaryBtnColor" value="#667eea">
          </div>
          <div class="settings-row">
            <label>Primary Button Hover:</label>
            <input type="color" id="primaryBtnHoverColor" value="#5a67d8">
          </div>
          <div class="settings-row">
            <label>Action Button Color:</label>
            <input type="color" id="actionBtnColor" value="#f2f5f9">
          </div>
          <div class="settings-row">
            <label>Action Button Text:</label>
            <input type="color" id="actionBtnTextColor" value="#1f2e3a">
          </div>
        </div>

        <div class="settings-group">
          <h3>Theme Colors</h3>
          <div class="settings-row">
            <label>Task Text Color:</label>
            <input type="color" id="taskTextColor" value="#1a2c38">
          </div>
          <div class="settings-row">
            <label>Page Background:</label>
            <input type="color" id="pageBgColor" value="#667eea">
          </div>
          <div class="settings-row">
            <label>Card Background:</label>
            <input type="color" id="cardBgColor" value="#ffffff">
          </div>
        </div>

        <div class="settings-group">
          <h3>Alarm Sound</h3>
          <select id="alarmSoundSelect">
            <option value="Egg Timer Vibes">Egg Timer Vibes</option>
            <option value="Flow">Flow</option>
            <option value="iPhone Note">iPhone Note</option>
            <option value="Clear Tone">Clear Tone</option>
            <option value="LG Note">LG Note</option>
            <option value="Telegram Note">Telegram Note</option>
            <option value="Spongebob Note">Spongebob Note</option>
            <option value="Message Tones">Message Tones</option>
          </select>
        </div>
      </div>
      <div class="settings-modal-footer">
        <button class="settings-save-btn" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    // 4 Independent Background Timers
    class BackgroundTimer {
      constructor(name, defaultMinutes, statusTimeId, badgeId) {
        this.name = name;
        this.currentSeconds = defaultMinutes * 60;
        this.isRunning = false;
        this.interval = null;
        this.defaultMinutes = defaultMinutes;
        this.statusTimeElement = document.getElementById(statusTimeId);
        this.badgeElement = document.getElementById(badgeId);
        this.updateStatusDisplay();
      }

      updateStatusDisplay() {
        if (this.statusTimeElement) {
          const mins = Math.floor(this.currentSeconds / 60);
          const secs = this.currentSeconds % 60;
          this.statusTimeElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        if (this.badgeElement) {
          this.badgeElement.className = `status-badge ${this.isRunning ? 'running' : (this.currentSeconds < this.defaultMinutes * 60 ? 'paused' : 'idle')}`;
        }
      }

      playAlarm() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const now = audioCtx.currentTime;
          const gain = audioCtx.createGain();
          gain.connect(audioCtx.destination);
          gain.gain.setValueAtTime(0.3, now);
          const osc = audioCtx.createOscillator();
          osc.connect(gain);
          osc.frequency.value = 880;
          osc.type = 'sine';
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.00001, now + 1);
          osc.stop(now + 0.8);
          audioCtx.resume();
        } catch(e) {}
      }

      finish() {
        if (this.interval) {
          clearInterval(this.interval);
          this.interval = null;
        }
        this.isRunning = false;
        this.playAlarm();
        this.updateStatusDisplay();
      }

      tick() {
        if (this.currentSeconds <= 0) {
          if (this.isRunning) this.finish();
          return;
        }
        this.currentSeconds--;
        this.updateStatusDisplay();
        if (this.currentSeconds === 0) this.finish();
      }

      start() {
        if (this.interval) clearInterval(this.interval);
        this.isRunning = true;
        this.interval = setInterval(() => {
          if (this.isRunning) this.tick();
        }, 1000);
        this.updateStatusDisplay();
      }

      pause() {
        this.isRunning = false;
        if (this.interval) {
          clearInterval(this.interval);
          this.interval = null;
        }
        this.updateStatusDisplay();
      }

      reset() {
        this.pause();
        this.currentSeconds = this.defaultMinutes * 60;
        this.updateStatusDisplay();
      }

      setDuration(minutes) {
        this.defaultMinutes = minutes;
        if (!this.isRunning) {
          this.currentSeconds = minutes * 60;
          this.updateStatusDisplay();
        }
      }

      getCurrentDisplay() {
        const mins = Math.floor(this.currentSeconds / 60);
        const secs = this.currentSeconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      getIsRunning() {
        return this.isRunning;
      }
    }

    // Initialize 4 background timers
    const sessionTimer = new BackgroundTimer('session', 25, 'sessionStatusTime', 'sessionBadge');
    const shortBreakTimer = new BackgroundTimer('shortBreak', 5, 'shortBreakStatusTime', 'shortBreakBadge');
    const longBreakTimer = new BackgroundTimer('longBreak', 15, 'longBreakStatusTime', 'longBreakBadge');
    const customTimer = new BackgroundTimer('custom', 30, 'customStatusTime', 'customBadge');

    const timers = {
      session: sessionTimer,
      shortBreak: shortBreakTimer,
      longBreak: longBreakTimer,
      custom: customTimer
    };

    // Current active view
    let currentView = 'session';
    const mainDisplay = document.getElementById('timerDisplay');
    const playPauseText = document.getElementById('playPauseText');

    function updateMainDisplay() {
      const timer = timers[currentView];
      if (timer) {
        mainDisplay.textContent = timer.getCurrentDisplay();
        playPauseText.innerText = timer.getIsRunning() ? 'Pause' : 'Start';
      }
    }

    // Update main display every second
    setInterval(() => {
      updateMainDisplay();
    }, 1000);

    // Mode switching - timers continue running in background
    const modeBtns = document.querySelectorAll('.mode-btn');
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        currentView = mode;
        
        // Update active button styling
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (mode === 'all') {
          // Show all timers view - expand status bar into full view
          showAllTimersView();
        } else {
          // Show single timer view
          showSingleTimerView();
          updateMainDisplay();
        }
      });
    });

    function showSingleTimerView() {
      document.querySelector('.timer-circle').style.display = 'block';
      document.querySelector('.status-bar').style.display = 'flex';
      // Reset status bar to normal
    }

    function showAllTimersView() {
      // For "All" view, we show all timers prominently
      // The status bar already shows all timers, we just keep it visible
      document.querySelector('.timer-circle').style.display = 'block';
      document.querySelector('.status-bar').style.display = 'flex';
      // Highlight that we're in all view
    }

    // Start/Pause button controls the CURRENTLY VIEWED timer
    const playPauseBtn = document.getElementById('playPauseBtn');
    if (playPauseBtn) {
      playPauseBtn.onclick = () => {
        const timer = timers[currentView];
        if (timer) {
          if (timer.getIsRunning()) {
            timer.pause();
            playPauseText.innerText = 'Start';
          } else {
            timer.start();
            playPauseText.innerText = 'Pause';
          }
          updateMainDisplay();
        }
      };
    }

    // Reset button resets the CURRENTLY VIEWED timer
    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) {
      resetBtn.onclick = () => {
        const timer = timers[currentView];
        if (timer) {
          timer.reset();
          updateMainDisplay();
        }
      };
    }

    // Click on status bar items switches view
    document.querySelectorAll('.status-item').forEach(item => {
      item.addEventListener('click', () => {
        const mode = item.dataset.status;
        currentView = mode;
        modeBtns.forEach(btn => {
          if (btn.dataset.mode === mode) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        updateMainDisplay();
      });
    });

    // ========== TASKS MODULE ==========
    let tasks = [];
    const taskListContainer = document.getElementById('taskListContainer');
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');

    function saveTasks() {
      localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
    }

    function loadTasks() {
      const saved = localStorage.getItem('pomodoro_tasks');
      if (saved) tasks = JSON.parse(saved);
      renderTasks();
    }

    function renderTasks() {
      if (!taskListContainer) return;
      taskListContainer.innerHTML = '';
      
      const incomplete = tasks.filter(t => !t.completed);
      const completed = tasks.filter(t => t.completed);
      const sorted = [...incomplete, ...completed];
      
      if (sorted.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-tasks';
        empty.innerText = 'No tasks yet — add something to focus on';
        taskListContainer.appendChild(empty);
        return;
      }
      
      sorted.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'task-completed' : ''}`;
        
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'task-check';
        check.checked = task.completed;
        check.onchange = () => {
          task.completed = check.checked;
          saveTasks();
          renderTasks();
        };
        
        const text = document.createElement('input');
        text.type = 'text';
        text.className = 'task-text';
        text.value = task.text;
        text.onblur = () => {
          task.text = text.value.trim() || 'Untitled';
          saveTasks();
          renderTasks();
        };
        text.onkeypress = (e) => { if (e.key === 'Enter') text.blur(); };
        
        const del = document.createElement('button');
        del.className = 'delete-task';
        del.innerHTML = '×';
        del.onclick = () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          renderTasks();
        };
        
        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(del);
        taskListContainer.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') return;
      tasks.push({ id: Date.now(), text: text, completed: false });
      saveTasks();
      taskInput.value = '';
      renderTasks();
    }

    if (addTaskBtn) addTaskBtn.onclick = addTask;
    if (taskInput) taskInput.onkeypress = (e) => { if (e.key === 'Enter') addTask(); };

    // ========== SETTINGS ==========
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettingsBtn = document.querySelector('.settings-close-btn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');

    function loadSettings() {
      const saved = localStorage.getItem('pomodoro_settings');
      if (saved) {
        const settings = JSON.parse(saved);
        if (settings.pageBgColor) document.body.style.backgroundColor = settings.pageBgColor;
        if (settings.cardBgColor) document.querySelector('.timer-card').style.backgroundColor = settings.cardBgColor;
        if (settings.timerTextColor) mainDisplay.style.color = settings.timerTextColor;
        if (settings.timerBgColor) mainDisplay.style.backgroundColor = settings.timerBgColor;
        if (settings.alarmSound) document.getElementById('alarmSoundSelect').value = settings.alarmSound;
      }
    }

    if (settingsBtn) {
      settingsBtn.onclick = () => {
        settingsOverlay.style.display = 'flex';
      };
    }

    if (closeSettingsBtn) closeSettingsBtn.onclick = () => settingsOverlay.style.display = 'none';
    if (settingsOverlay) settingsOverlay.onclick = (e) => { if (e.target === settingsOverlay) settingsOverlay.style.display = 'none'; };

    if (saveSettingsBtn) {
      saveSettingsBtn.onclick = () => {
        const timerTextColor = document.getElementById('timerTextColor').value;
        const timerBgColor = document.getElementById('timerBgColor').value;
        const primaryBtnColor = document.getElementById('primaryBtnColor').value;
        const primaryBtnHoverColor = document.getElementById('primaryBtnHoverColor').value;
        const actionBtnColor = document.getElementById('actionBtnColor').value;
        const actionBtnTextColor = document.getElementById('actionBtnTextColor').value;
        const taskTextColor = document.getElementById('taskTextColor').value;
        const pageBgColor = document.getElementById('pageBgColor').value;
        const cardBgColor = document.getElementById('cardBgColor').value;
        const alarmSound = document.getElementById('alarmSoundSelect').value;
        
        localStorage.setItem('pomodoro_settings', JSON.stringify({
          timerTextColor, timerBgColor, primaryBtnColor, primaryBtnHoverColor,
          actionBtnColor, actionBtnTextColor, taskTextColor, pageBgColor, cardBgColor, alarmSound
        }));
        
        document.body.style.backgroundColor = pageBgColor;
        document.querySelector('.timer-card').style.backgroundColor = cardBgColor;
        mainDisplay.style.color = timerTextColor;
        mainDisplay.style.backgroundColor = timerBgColor;
        
        settingsOverlay.style.display = 'none';
      };
    }

    // Set active mode on load
    document.querySelector('.mode-btn[data-mode="session"]').classList.add('active');
    loadTasks();
    loadSettings();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #667eea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .timer-card {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      text-align: center;
    }

    .mode-selector {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: #f0f2f5;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      color: #4a5568;
    }

    .mode-btn:hover {
      background: #e2e8f0;
    }

    .mode-btn.active {
      background: #667eea;
      color: white;
    }

    .timer-circle {
      text-align: center;
      margin: 1rem 0;
    }

    .timer-digits {
      font-size: 5rem;
      font-weight: 600;
      font-family: monospace;
      background: #667eea;
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 80px;
      color: white;
      letter-spacing: 4px;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }

    .icon-btn {
      background: #f2f5f9;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #1f2e3a;
      font-size: 1rem;
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    .icon-btn:hover {
      background: #e6edf4;
      transform: scale(0.98);
    }

    .tasks-section {
      margin-top: 2rem;
      border-top: 2px solid #edeff4;
      padding-top: 1.5rem;
    }

    .tasks-header {
      margin-bottom: 1rem;
      text-align: left;
    }

    .tasks-header h3 {
      font-size: 1.2rem;
      color: #1f2b36;
    }

    .task-input-container {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .task-input-field {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid #cfdee9;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .task-input-field:focus {
      border-color: #667eea;
    }

    .add-task-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }

    .add-task-btn:hover {
      background: #5a67d8;
    }

    .task-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .task-item {
      background: #f9fbfd;
      border-radius: 0.8rem;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #eef2f6;
    }

    .task-check {
      width: 1.2rem;
      height: 1.2rem;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      padding: 0.2rem 0;
      font-family: inherit;
      color: #1a2c38;
      text-align: left;
    }

    .task-text:focus {
      outline: none;
      border-bottom: 1px dashed #667eea;
    }

    .task-completed .task-text {
      text-decoration: line-through;
      color: #8ba0ae;
    }

    .delete-task {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #9aaebf;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .delete-task:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .empty-tasks {
      padding: 1.5rem;
      text-align: center;
      color: #93a9bb;
      font-size: 0.85rem;
      background: #fbfdff;
      border-radius: 0.8rem;
      border: 1px dashed #dce5ec;
    }

    .settings-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .settings-modal {
      background: white;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-modal-header h2 {
      font-size: 1.3rem;
      color: #1f2b36;
    }

    .settings-close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #93a9bb;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .settings-close-btn:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .settings-modal-body {
      padding: 1.5rem;
    }

    .settings-group {
      margin-bottom: 1.8rem;
    }

    .settings-group h3 {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 1rem;
    }

    .settings-row label {
      font-weight: 500;
      color: #2d3748;
      font-size: 0.9rem;
    }

    .settings-row input {
      width: 100px;
      padding: 0.5rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-row input[type="color"] {
      width: 60px;
      height: 35px;
    }

    .settings-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #edeff4;
      display: flex;
      justify-content: flex-end;
    }

    .settings-save-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .settings-save-btn:hover {
      background: #5a67d8;
    }

    @media (max-width: 600px) {
      .timer-card { padding: 1.2rem; }
      .timer-digits { font-size: 3rem; padding: 0.3rem 1rem; }
      .mode-btn { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
      .icon-btn { padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="timer-card">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="session">Session</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
        <button class="mode-btn" data-mode="custom">Custom</button>
      </div>

      <div class="timer-circle">
        <div class="timer-digits" id="timerDisplay">25:00</div>
      </div>

      <div class="action-buttons">
        <button class="icon-btn" id="playPauseBtn">
          <span class="btn-icon">▶</span>
          <span id="playPauseText">Start</span>
        </button>
        <button class="icon-btn" id="resetBtn">
          <span class="btn-icon">⟳</span>
          <span>Reset</span>
        </button>
        <button class="icon-btn" id="settingsBtn">
          <span class="btn-icon">⚙</span>
          <span>Settings</span>
        </button>
      </div>

      <div class="tasks-section">
        <div class="tasks-header">
          <h3>Tasks</h3>
        </div>
        <div class="task-input-container">
          <input type="text" id="taskInput" placeholder="Enter a new task..." class="task-input-field">
          <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
        </div>
        <ul class="task-list" id="taskListContainer">
          <li class="empty-tasks">No tasks yet — add something to focus on</li>
        </ul>
      </div>
    </div>
  </div>

  <div id="settingsOverlay" class="settings-overlay">
    <div class="settings-modal">
      <div class="settings-modal-header">
        <h2>Settings</h2>
        <button class="settings-close-btn">&times;</button>
      </div>
      <div class="settings-modal-body">
        <div class="settings-group">
          <h3>Timer Duration (minutes)</h3>
          <div class="settings-row">
            <label>Session Time:</label>
            <input type="number" id="sessionTime" min="1" max="99" value="25">
          </div>
          <div class="settings-row">
            <label>Short Break:</label>
            <input type="number" id="shortBreakTime" min="1" max="99" value="5">
          </div>
          <div class="settings-row">
            <label>Long Break:</label>
            <input type="number" id="longBreakTime" min="1" max="99" value="15">
          </div>
          <div class="settings-row">
            <label>Custom Time:</label>
            <input type="number" id="customTime" min="1" max="99" value="30">
          </div>
        </div>

        <div class="settings-group">
          <h3>Appearance</h3>
          <div class="settings-row">
            <label>Text Color:</label>
            <input type="color" id="textColor" value="#1a2c38">
          </div>
          <div class="settings-row">
            <label>Background Color:</label>
            <input type="color" id="bgColor" value="#667eea">
          </div>
          <div class="settings-row">
            <label>Card Background:</label>
            <input type="color" id="cardBgColor" value="#ffffff">
          </div>
        </div>

        <div class="settings-group">
          <h3>Alarm Sound</h3>
          <select id="alarmSoundSelect">
            <option value="Egg Timer Vibes">Egg Timer Vibes</option>
            <option value="Flow">Flow</option>
            <option value="iPhone Note">iPhone Note</option>
            <option value="Clear Tone">Clear Tone</option>
            <option value="LG Note">LG Note</option>
            <option value="Telegram Note">Telegram Note</option>
            <option value="Spongebob Note">Spongebob Note</option>
            <option value="Message Tones">Message Tones</option>
          </select>
        </div>
      </div>
      <div class="settings-modal-footer">
        <button class="settings-save-btn" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Wait for DOM to be fully loaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      function init() {
        console.log('App initializing...');
        
        // DOM Elements
        const timerDisplay = document.getElementById('timerDisplay');
        const playPauseText = document.getElementById('playPauseText');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const closeSettingsBtn = document.querySelector('.settings-close-btn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskListContainer = document.getElementById('taskListContainer');
        
        // Timer State
        let timerInterval = null;
        let currentSeconds = 25 * 60;
        let isRunning = false;
        let currentMode = 'session';
        let sessionTime = 25;
        let shortBreakTime = 5;
        let longBreakTime = 15;
        let customTime = 30;
        
        // Tasks Array
        let tasks = [];
        
        // Load saved data
        function loadSavedData() {
          const savedTimer = localStorage.getItem('pomodoro_timer');
          if (savedTimer) {
            const data = JSON.parse(savedTimer);
            currentSeconds = data.currentSeconds || 25 * 60;
            currentMode = data.currentMode || 'session';
            sessionTime = data.sessionTime || 25;
            shortBreakTime = data.shortBreakTime || 5;
            longBreakTime = data.longBreakTime || 15;
            customTime = data.customTime || 30;
          }
          
          const savedTasks = localStorage.getItem('pomodoro_tasks');
          if (savedTasks) {
            tasks = JSON.parse(savedTasks);
          }
          
          const savedSettings = localStorage.getItem('pomodoro_settings');
          if (savedSettings) {
            const settings = JSON.parse(savedSettings);
            sessionTime = settings.sessionTime || 25;
            shortBreakTime = settings.shortBreakTime || 5;
            longBreakTime = settings.longBreakTime || 15;
            customTime = settings.customTime || 30;
            if (settings.bgColor) document.body.style.backgroundColor = settings.bgColor;
            if (settings.cardBgColor) document.querySelector('.timer-card').style.backgroundColor = settings.cardBgColor;
            if (settings.textColor) {
              document.querySelectorAll('.task-text, .tasks-header h3').forEach(el => el.style.color = settings.textColor);
              document.querySelector('.timer-digits').style.backgroundColor = settings.textColor;
            }
          }
        }
        
        // Save timer state
        function saveTimerState() {
          localStorage.setItem('pomodoro_timer', JSON.stringify({
            currentSeconds: currentSeconds,
            currentMode: currentMode,
            sessionTime: sessionTime,
            shortBreakTime: shortBreakTime,
            longBreakTime: longBreakTime,
            customTime: customTime
          }));
        }
        
        // Save tasks
        function saveTasks() {
          localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
        }
        
        // Update timer display
        function updateDisplay() {
          const mins = Math.floor(currentSeconds / 60);
          const secs = currentSeconds % 60;
          timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Play alarm
        function playAlarm() {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.3, now);
            const osc = audioCtx.createOscillator();
            osc.connect(gain);
            osc.frequency.value = 880;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 1);
            osc.stop(now + 0.8);
            audioCtx.resume();
          } catch(e) {
            console.log('Audio error:', e);
          }
        }
        
        // Finish timer
        function finishTimer() {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          isRunning = false;
          playPauseText.innerText = 'Start';
          playAlarm();
          saveTimerState();
        }
        
        // Timer tick
        function tick() {
          if (currentSeconds <= 0) {
            if (isRunning) finishTimer();
            return;
          }
          currentSeconds--;
          updateDisplay();
          if (currentSeconds === 0) finishTimer();
          saveTimerState();
        }
        
        // Start timer
        function startTimer() {
          if (timerInterval) clearInterval(timerInterval);
          isRunning = true;
          playPauseText.innerText = 'Pause';
          timerInterval = setInterval(() => {
            if (isRunning) tick();
          }, 1000);
          saveTimerState();
        }
        
        // Pause timer
        function pauseTimer() {
          isRunning = false;
          playPauseText.innerText = 'Start';
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          saveTimerState();
        }
        
        // Reset timer
        function resetTimer() {
          pauseTimer();
          setMode(currentMode);
        }
        
        // Set mode
        function setMode(mode) {
          currentMode = mode;
          let duration = sessionTime;
          switch(mode) {
            case 'session': duration = sessionTime; break;
            case 'shortBreak': duration = shortBreakTime; break;
            case 'longBreak': duration = longBreakTime; break;
            case 'custom': duration = customTime; break;
          }
          currentSeconds = duration * 60;
          updateDisplay();
          playPauseText.innerText = 'Start';
          isRunning = false;
          
          modeBtns.forEach(btn => {
            if (btn.dataset.mode === mode) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
          saveTimerState();
        }
        
        // Render tasks
        function renderTasks() {
          if (!taskListContainer) return;
          taskListContainer.innerHTML = '';
          
          const incomplete = tasks.filter(t => !t.completed);
          const completed = tasks.filter(t => t.completed);
          const sorted = [...incomplete, ...completed];
          
          if (sorted.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'empty-tasks';
            empty.innerText = 'No tasks yet — add something to focus on';
            taskListContainer.appendChild(empty);
            return;
          }
          
          sorted.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'task-completed' : ''}`;
            
            const check = document.createElement('input');
            check.type = 'checkbox';
            check.className = 'task-check';
            check.checked = task.completed;
            check.onchange = () => {
              task.completed = check.checked;
              saveTasks();
              renderTasks();
            };
            
            const text = document.createElement('input');
            text.type = 'text';
            text.className = 'task-text';
            text.value = task.text;
            text.onblur = () => {
              task.text = text.value.trim() || 'Untitled';
              saveTasks();
              renderTasks();
            };
            text.onkeypress = (e) => { if (e.key === 'Enter') text.blur(); };
            
            const del = document.createElement('button');
            del.className = 'delete-task';
            del.innerHTML = '×';
            del.onclick = () => {
              tasks = tasks.filter(t => t.id !== task.id);
              saveTasks();
              renderTasks();
            };
            
            li.appendChild(check);
            li.appendChild(text);
            li.appendChild(del);
            taskListContainer.appendChild(li);
          });
        }
        
        // Add task
        function addTask() {
          const text = taskInput.value.trim();
          if (text === '') return;
          tasks.push({ id: Date.now(), text: text, completed: false });
          saveTasks();
          taskInput.value = '';
          renderTasks();
        }
        
        // Event Listeners
        if (playPauseBtn) {
          playPauseBtn.onclick = function() {
            if (isRunning) {
              pauseTimer();
            } else {
              startTimer();
            }
          };
        }
        
        if (resetBtn) resetBtn.onclick = resetTimer;
        
        if (settingsBtn) {
          settingsBtn.onclick = function() {
            // Load current settings into modal
            document.getElementById('sessionTime').value = sessionTime;
            document.getElementById('shortBreakTime').value = shortBreakTime;
            document.getElementById('longBreakTime').value = longBreakTime;
            document.getElementById('customTime').value = customTime;
            settingsOverlay.style.display = 'flex';
          };
        }
        
        if (closeSettingsBtn) {
          closeSettingsBtn.onclick = function() {
            settingsOverlay.style.display = 'none';
          };
        }
        
        if (settingsOverlay) {
          settingsOverlay.onclick = function(e) {
            if (e.target === settingsOverlay) settingsOverlay.style.display = 'none';
          };
        }
        
        if (saveSettingsBtn) {
          saveSettingsBtn.onclick = function() {
            sessionTime = parseInt(document.getElementById('sessionTime').value) || 25;
            shortBreakTime = parseInt(document.getElementById('shortBreakTime').value) || 5;
            longBreakTime = parseInt(document.getElementById('longBreakTime').value) || 15;
            customTime = parseInt(document.getElementById('customTime').value) || 30;
            const textColor = document.getElementById('textColor').value;
            const bgColor = document.getElementById('bgColor').value;
            const cardBgColor = document.getElementById('cardBgColor').value;
            const alarmSound = document.getElementById('alarmSoundSelect').value;
            
            localStorage.setItem('pomodoro_settings', JSON.stringify({
              sessionTime, shortBreakTime, longBreakTime, customTime,
              textColor, bgColor, cardBgColor, alarmSound
            }));
            
            document.body.style.backgroundColor = bgColor;
            document.querySelector('.timer-card').style.backgroundColor = cardBgColor;
            document.querySelectorAll('.task-text, .tasks-header h3').forEach(el => {
              el.style.color = textColor;
            });
            document.querySelector('.timer-digits').style.backgroundColor = textColor;
            
            setMode(currentMode);
            settingsOverlay.style.display = 'none';
          };
        }
        
        modeBtns.forEach(btn => {
          btn.onclick = function() {
            setMode(this.dataset.mode);
          };
        });
        
        if (addTaskBtn) addTaskBtn.onclick = addTask;
        if (taskInput) {
          taskInput.onkeypress = function(e) {
            if (e.key === 'Enter') addTask();
          };
        }
        
        // Initialize
        loadSavedData();
        setMode(currentMode);
        renderTasks();
        console.log('App initialized successfully');
      }
    })();
  </script>
</body>
</html>

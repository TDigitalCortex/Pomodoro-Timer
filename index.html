<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #667eea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .timer-card {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      text-align: center;
    }

    .mode-selector {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: #f0f2f5;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      color: #4a5568;
    }

    .mode-btn:hover {
      background: #e2e8f0;
    }

    .mode-btn.active {
      background: #667eea;
      color: white;
    }

    .timer-circle {
      text-align: center;
      margin: 1rem 0;
    }

    .timer-digits {
      font-size: 5rem;
      font-weight: 600;
      font-family: monospace;
      background: #667eea;
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 80px;
      color: white;
      letter-spacing: 4px;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }

    .icon-btn {
      background: #f2f5f9;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #1f2e3a;
      font-size: 1rem;
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    .icon-btn:hover {
      background: #e6edf4;
    }

    .tasks-section {
      margin-top: 2rem;
      border-top: 2px solid #edeff4;
      padding-top: 1.5rem;
    }

    .tasks-header {
      margin-bottom: 1rem;
      text-align: left;
    }

    .tasks-header h3 {
      font-size: 1.2rem;
      color: #1f2b36;
    }

    .task-input-container {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .task-input-field {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid #cfdee9;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .task-input-field:focus {
      border-color: #667eea;
    }

    .add-task-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }

    .add-task-btn:hover {
      background: #5a67d8;
    }

    .task-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .task-item {
      background: #f9fbfd;
      border-radius: 0.8rem;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #eef2f6;
    }

    .task-check {
      width: 1.2rem;
      height: 1.2rem;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      padding: 0.2rem 0;
      font-family: inherit;
      color: #1a2c38;
      text-align: left;
    }

    .task-text:focus {
      outline: none;
      border-bottom: 1px dashed #667eea;
    }

    .task-completed .task-text {
      text-decoration: line-through;
      color: #8ba0ae;
    }

    .delete-task {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #9aaebf;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .delete-task:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .empty-tasks {
      padding: 1.5rem;
      text-align: center;
      color: #93a9bb;
      font-size: 0.85rem;
      background: #fbfdff;
      border-radius: 0.8rem;
      border: 1px dashed #dce5ec;
    }

    .settings-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .settings-modal {
      background: white;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-modal-header h2 {
      font-size: 1.3rem;
      color: #1f2b36;
    }

    .settings-close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #93a9bb;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .settings-close-btn:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .settings-modal-body {
      padding: 1.5rem;
    }

    .settings-group {
      margin-bottom: 1.8rem;
    }

    .settings-group h3 {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 1rem;
    }

    .settings-row label {
      font-weight: 500;
      color: #2d3748;
      font-size: 0.9rem;
    }

    .settings-row input {
      width: 100px;
      padding: 0.5rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-row input[type="color"] {
      width: 60px;
      height: 35px;
    }

    .settings-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #edeff4;
      display: flex;
      justify-content: flex-end;
    }

    .settings-save-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .settings-save-btn:hover {
      background: #5a67d8;
    }

    @media (max-width: 600px) {
      .timer-card { padding: 1.2rem; }
      .timer-digits { font-size: 3rem; padding: 0.3rem 1rem; }
      .mode-btn { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
      .icon-btn { padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="timer-card">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="session">Session</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
        <button class="mode-btn" data-mode="custom">Custom</button>
      </div>

      <div class="timer-circle">
        <div class="timer-digits" id="timerDisplay">25:00</div>
      </div>

      <div class="action-buttons">
        <button class="icon-btn" id="playPauseBtn">
          <span class="btn-icon">▶</span>
          <span id="playPauseText">Start</span>
        </button>
        <button class="icon-btn" id="resetBtn">
          <span class="btn-icon">⟳</span>
          <span>Reset</span>
        </button>
        <button class="icon-btn" id="settingsBtn">
          <span class="btn-icon">⚙</span>
          <span>Settings</span>
        </button>
      </div>

      <div class="tasks-section">
        <div class="tasks-header">
          <h3>Tasks</h3>
        </div>
        <div class="task-input-container">
          <input type="text" id="taskInput" placeholder="Enter a new task..." class="task-input-field">
          <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
        </div>
        <ul class="task-list" id="taskListContainer">
          <li class="empty-tasks">No tasks yet — add something to focus on</li>
        </ul>
      </div>
    </div>
  </div>

  <div id="settingsOverlay" class="settings-overlay">
    <div class="settings-modal">
      <div class="settings-modal-header">
        <h2>Settings</h2>
        <button class="settings-close-btn">&times;</button>
      </div>
      <div class="settings-modal-body">
        <div class="settings-group">
          <h3>Timer Duration (minutes)</h3>
          <div class="settings-row">
            <label>Session Time:</label>
            <input type="number" id="sessionTime" min="1" max="99" value="25">
          </div>
          <div class="settings-row">
            <label>Short Break:</label>
            <input type="number" id="shortBreakTime" min="1" max="99" value="5">
          </div>
          <div class="settings-row">
            <label>Long Break:</label>
            <input type="number" id="longBreakTime" min="1" max="99" value="15">
          </div>
          <div class="settings-row">
            <label>Custom Time:</label>
            <input type="number" id="customTime" min="1" max="99" value="30">
          </div>
        </div>

        <div class="settings-group">
          <h3>Appearance</h3>
          <div class="settings-row">
            <label>Text Color:</label>
            <input type="color" id="textColor" value="#1a2c38">
          </div>
          <div class="settings-row">
            <label>Background Color:</label>
            <input type="color" id="bgColor" value="#667eea">
          </div>
          <div class="settings-row">
            <label>Card Background:</label>
            <input type="color" id="cardBgColor" value="#ffffff">
          </div>
        </div>

        <div class="settings-group">
          <h3>Alarm Sound</h3>
          <select id="alarmSoundSelect">
            <option value="Egg Timer Vibes">Egg Timer Vibes</option>
            <option value="Flow">Flow</option>
            <option value="iPhone Note">iPhone Note</option>
            <option value="Clear Tone">Clear Tone</option>
            <option value="LG Note">LG Note</option>
            <option value="Telegram Note">Telegram Note</option>
            <option value="Spongebob Note">Spongebob Note</option>
            <option value="Message Tones">Message Tones</option>
          </select>
        </div>
      </div>
      <div class="settings-modal-footer">
        <button class="settings-save-btn" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    // ========== STORAGE MODULE ==========
    const Storage = {
      saveTimerState(state) { localStorage.setItem('pomodoro_timer', JSON.stringify(state)); },
      loadTimerState() { const saved = localStorage.getItem('pomodoro_timer'); return saved ? JSON.parse(saved) : null; },
      saveTasks(tasks) { localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks)); },
      loadTasks() { const saved = localStorage.getItem('pomodoro_tasks'); return saved ? JSON.parse(saved) : []; },
      saveSettings(settings) { localStorage.setItem('pomodoro_settings', JSON.stringify(settings)); },
      loadSettings() { const saved = localStorage.getItem('pomodoro_settings'); return saved ? JSON.parse(saved) : null; }
    };

    // ========== TIMER MODULE ==========
    const Timer = {
      timerInterval: null,
      currentSeconds: 25 * 60,
      isRunning: false,
      currentMode: 'session',
      sessionTime: 25,
      shortBreakTime: 5,
      longBreakTime: 15,
      customTime: 30,
      displayElement: null,
      playPauseTextElement: null,

      updateDisplay() {
        if (!this.displayElement) return;
        const mins = Math.floor(this.currentSeconds / 60);
        const secs = this.currentSeconds % 60;
        this.displayElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      },

      playAlarm() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const now = audioCtx.currentTime;
          const gain = audioCtx.createGain();
          gain.connect(audioCtx.destination);
          gain.gain.setValueAtTime(0.3, now);
          const osc = audioCtx.createOscillator();
          osc.connect(gain);
          osc.frequency.value = 880;
          osc.type = 'sine';
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.00001, now + 1);
          osc.stop(now + 0.8);
          audioCtx.resume();
        } catch(e) { console.log('Audio error:', e); }
      },

      finishTimer() {
        if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
        this.isRunning = false;
        if (this.playPauseTextElement) this.playPauseTextElement.innerText = 'Start';
        this.playAlarm();
        this.saveState();
      },

      tick() {
        if (this.currentSeconds <= 0) {
          if (this.isRunning) this.finishTimer();
          return;
        }
        this.currentSeconds--;
        this.updateDisplay();
        if (this.currentSeconds === 0) this.finishTimer();
        this.saveState();
      },

      start() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.isRunning = true;
        if (this.playPauseTextElement) this.playPauseTextElement.innerText = 'Pause';
        this.timerInterval = setInterval(() => { if (this.isRunning) this.tick(); }, 1000);
        this.saveState();
      },

      pause() {
        this.isRunning = false;
        if (this.playPauseTextElement) this.playPauseTextElement.innerText = 'Start';
        if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
        this.saveState();
      },

      reset() { this.pause(); this.setMode(this.currentMode); },

      setMode(mode) {
        this.currentMode = mode;
        let duration = this.sessionTime;
        switch(mode) {
          case 'session': duration = this.sessionTime; break;
          case 'shortBreak': duration = this.shortBreakTime; break;
          case 'longBreak': duration = this.longBreakTime; break;
          case 'custom': duration = this.customTime; break;
        }
        this.currentSeconds = duration * 60;
        this.updateDisplay();
        if (this.playPauseTextElement) this.playPauseTextElement.innerText = 'Start';
        this.isRunning = false;
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
          if (btn.dataset.mode === mode) btn.classList.add('active');
          else btn.classList.remove('active');
        });
        this.saveState();
      },

      updateDurations(session, short, long, custom) {
        this.sessionTime = session;
        this.shortBreakTime = short;
        this.longBreakTime = long;
        this.customTime = custom;
        this.setMode(this.currentMode);
      },

      saveState() {
        Storage.saveTimerState({
          currentSeconds: this.currentSeconds,
          currentMode: this.currentMode,
          sessionTime: this.sessionTime,
          shortBreakTime: this.shortBreakTime,
          longBreakTime: this.longBreakTime,
          customTime: this.customTime
        });
      },

      loadState() {
        const saved = Storage.loadTimerState();
        if (saved) {
          this.currentSeconds = saved.currentSeconds || 25 * 60;
          this.currentMode = saved.currentMode || 'session';
          this.sessionTime = saved.sessionTime || 25;
          this.shortBreakTime = saved.shortBreakTime || 5;
          this.longBreakTime = saved.longBreakTime || 15;
          this.customTime = saved.customTime || 30;
          this.updateDisplay();
        }
      },

      init(displayId, playPauseTextId) {
        this.displayElement = document.getElementById(displayId);
        this.playPauseTextElement = document.getElementById(playPauseTextId);
        this.loadState();
        this.setMode(this.currentMode);
      }
    };

    // ========== TASKS MODULE ==========
    const TaskManager = {
      tasks: [],
      containerElement: null,
      taskInputElement: null,

      saveToStorage() { Storage.saveTasks(this.tasks); },

      loadFromStorage() { this.tasks = Storage.loadTasks(); this.render(); },

      render() {
        if (!this.containerElement) return;
        this.containerElement.innerHTML = '';
        
        const incomplete = this.tasks.filter(t => !t.completed);
        const completed = this.tasks.filter(t => t.completed);
        const sorted = [...incomplete, ...completed];
        
        if (sorted.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-tasks';
          empty.innerText = 'No tasks yet — add something to focus on';
          this.containerElement.appendChild(empty);
          return;
        }
        
        sorted.forEach(task => {
          const li = document.createElement('li');
          li.className = `task-item ${task.completed ? 'task-completed' : ''}`;
          
          const check = document.createElement('input');
          check.type = 'checkbox';
          check.className = 'task-check';
          check.checked = task.completed;
          check.onchange = () => {
            task.completed = check.checked;
            this.saveToStorage();
            this.render();
          };
          
          const text = document.createElement('input');
          text.type = 'text';
          text.className = 'task-text';
          text.value = task.text;
          text.onblur = () => {
            task.text = text.value.trim() || 'Untitled';
            this.saveToStorage();
            this.render();
          };
          text.onkeypress = (e) => { if (e.key === 'Enter') text.blur(); };
          
          const del = document.createElement('button');
          del.className = 'delete-task';
          del.innerHTML = '×';
          del.onclick = () => {
            this.tasks = this.tasks.filter(t => t.id !== task.id);
            this.saveToStorage();
            this.render();
          };
          
          li.appendChild(check);
          li.appendChild(text);
          li.appendChild(del);
          this.containerElement.appendChild(li);
        });
      },

      addTask() {
        const text = this.taskInputElement.value.trim();
        if (text === '') return;
        this.tasks.push({ id: Date.now(), text: text, completed: false });
        this.saveToStorage();
        this.taskInputElement.value = '';
        this.render();
      },

      init(containerId, addButtonId, inputId) {
        this.containerElement = document.getElementById(containerId);
        this.taskInputElement = document.getElementById(inputId);
        const addBtn = document.getElementById(addButtonId);
        if (addBtn) addBtn.onclick = () => this.addTask();
        if (this.taskInputElement) {
          this.taskInputElement.onkeypress = (e) => { if (e.key === 'Enter') this.addTask(); };
        }
        this.loadFromStorage();
      }
    };

    // ========== APP INITIALIZATION ==========
    document.addEventListener('DOMContentLoaded', function() {
      Timer.init('timerDisplay', 'playPauseText');
      TaskManager.init('taskListContainer', 'addTaskBtn', 'taskInput');
      
      const playPauseBtn = document.getElementById('playPauseBtn');
      const resetBtn = document.getElementById('resetBtn');
      const settingsBtn = document.getElementById('settingsBtn');
      const overlay = document.getElementById('settingsOverlay');
      const closeBtn = document.querySelector('.settings-close-btn');
      const saveBtn = document.getElementById('saveSettingsBtn');
      
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.onclick = function() { Timer.setMode(this.dataset.mode); };
      });
      
      if (playPauseBtn) playPauseBtn.onclick = function() { Timer.isRunning ? Timer.pause() : Timer.start(); };
      if (resetBtn) resetBtn.onclick = function() { Timer.reset(); };
      if (settingsBtn) settingsBtn.onclick = function() { overlay.style.display = 'flex'; };
      if (closeBtn) closeBtn.onclick = function() { overlay.style.display = 'none'; };
      if (overlay) overlay.onclick = function(e) { if (e.target === overlay) overlay.style.display = 'none'; };
      
      if (saveBtn) {
        saveBtn.onclick = function() {
          const settings = {
            sessionTime: parseInt(document.getElementById('sessionTime').value) || 25,
            shortBreakTime: parseInt(document.getElementById('shortBreakTime').value) || 5,
            longBreakTime: parseInt(document.getElementById('longBreakTime').value) || 15,
            customTime: parseInt(document.getElementById('customTime').value) || 30,
            textColor: document.getElementById('textColor').value,
            bgColor: document.getElementById('bgColor').value,
            cardBgColor: document.getElementById('cardBgColor').value,
            alarmSound: document.getElementById('alarmSoundSelect').value
          };
          
          Storage.saveSettings(settings);
          localStorage.setItem('selected_alarm', settings.alarmSound);
          
          document.body.style.backgroundColor = settings.bgColor;
          document.querySelector('.timer-card').style.backgroundColor = settings.cardBgColor;
          document.querySelectorAll('.task-text, .tasks-header h3').forEach(el => {
            el.style.color = settings.textColor;
          });
          document.querySelector('.timer-digits').style.backgroundColor = settings.textColor;
          
          Timer.updateDurations(settings.sessionTime, settings.shortBreakTime, settings.longBreakTime, settings.customTime);
          overlay.style.display = 'none';
        };
      }
      
      const saved = Storage.loadSettings();
      if (saved) {
        document.body.style.backgroundColor = saved.bgColor;
        document.querySelector('.timer-card').style.backgroundColor = saved.cardBgColor;
        document.querySelectorAll('.task-text, .tasks-header h3').forEach(el => {
          el.style.color = saved.textColor;
        });
      }
    });
  </script>
</body>
</html>

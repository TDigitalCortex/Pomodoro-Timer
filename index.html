<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pomodoro Timer - 4 Independent Timers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #667eea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .timer-card {
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      text-align: center;
    }

    /* Mode Selector - Original */
    .mode-selector {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: #f0f2f5;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      color: #4a5568;
    }

    .mode-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: #667eea;
      color: white;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    /* 4 Timer Grid */
    .timers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .timer-unit {
      background: #f9fbfd;
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid #eef2f6;
    }

    .timer-unit-header {
      font-size: 0.9rem;
      font-weight: 600;
      padding-bottom: 0.5rem;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid #edeff4;
      text-align: center;
    }

    /* Timer Display - ORIGINAL 5rem size restored */
    .timer-display {
      font-size: 2.2rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 0.3rem;
      margin: 0.3rem 0;
      background: white;
      border-radius: 0.8rem;
      color: #1a2c38;
    }

    /* Timer Controls - Matching original icon-btn styling */
    .timer-controls {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 0.8rem 0;
      flex-wrap: wrap;
    }

    .timer-btn {
      background: #f2f5f9;
      border: none;
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 1.5rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      color: #1f2e3a;
      font-size: 0.75rem;
    }

    .timer-btn:hover {
      background: #e6edf4;
      transform: scale(0.97);
    }

    .duration-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #edeff4;
    }

    .duration-control label {
      font-size: 0.7rem;
      color: #718096;
    }

    .duration-control input {
      width: 50px;
      padding: 0.2rem;
      border: 1px solid #cfdee9;
      border-radius: 0.4rem;
      font-size: 0.7rem;
      text-align: center;
    }

    .duration-control button {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.2rem 0.5rem;
      border-radius: 0.4rem;
      cursor: pointer;
      font-size: 0.65rem;
    }

    .timer-status {
      font-size: 0.65rem;
      text-align: center;
      margin-top: 0.3rem;
      color: #93a9bb;
    }

    /* ORIGINAL ACTION BUTTONS - Start/Pause/Reset/Settings (outside grid) */
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: #f2f5f9;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #1f2e3a;
      font-size: 1rem;
      justify-content: center;
    }

    .btn-icon {
      font-size: 1.2rem;
    }

    .icon-btn:hover {
      background: #e6edf4;
      transform: scale(0.97);
    }

    /* Tasks Section - ORIGINAL */
    .tasks-section {
      margin-top: 2rem;
      border-top: 2px solid #edeff4;
      padding-top: 1.5rem;
    }

    .tasks-header {
      margin-bottom: 1rem;
      text-align: left;
    }

    .tasks-header h3 {
      font-size: 1.2rem;
      color: #1f2b36;
    }

    .task-input-container {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .task-input-field {
      flex: 1;
      min-width: 150px;
      padding: 0.7rem 1rem;
      border: 1px solid #cfdee9;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .task-input-field:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .add-task-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .add-task-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    .task-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .task-item {
      background: #f9fbfd;
      border-radius: 0.8rem;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #eef2f6;
    }

    .task-check {
      width: 1.2rem;
      height: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      padding: 0.2rem 0;
      font-family: inherit;
      color: #1a2c38;
      text-align: left;
    }

    .task-text:focus {
      outline: none;
      border-bottom: 1px dashed #667eea;
    }

    .task-completed .task-text {
      text-decoration: line-through;
      color: #8ba0ae;
    }

    .delete-task {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #9aaebf;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .delete-task:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .empty-tasks {
      padding: 1.5rem;
      text-align: center;
      color: #93a9bb;
      font-size: 0.85rem;
      background: #fbfdff;
      border-radius: 0.8rem;
      border: 1px dashed #dce5ec;
    }

    /* Settings Modal - ORIGINAL with all 10+ color options */
    .settings-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .settings-modal {
      background: white;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-modal-header h2 {
      font-size: 1.3rem;
      color: #1f2b36;
    }

    .settings-close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #93a9bb;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .settings-close-btn:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .settings-modal-body {
      padding: 1.5rem;
    }

    .settings-group {
      margin-bottom: 1.8rem;
    }

    .settings-group h3 {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .settings-row label {
      font-weight: 500;
      color: #2d3748;
      font-size: 0.9rem;
      min-width: 140px;
    }

    .settings-row input {
      width: 100px;
      padding: 0.5rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-row input[type="color"] {
      width: 70px;
      height: 40px;
      cursor: pointer;
    }

    .settings-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #edeff4;
      display: flex;
      justify-content: flex-end;
    }

    .settings-save-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .settings-save-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    /* Responsive - ORIGINAL button resizing behavior */
    @media (max-width: 900px) {
      .timers-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .timer-card {
        padding: 1.5rem;
      }
      .icon-btn {
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }
      .btn-icon {
        font-size: 1rem;
      }
    }

    @media (max-width: 550px) {
      .timers-grid {
        grid-template-columns: 1fr;
      }
      .action-buttons {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
      }
      .icon-btn {
        width: 100%;
        justify-content: center;
        padding: 0.7rem 1rem;
      }
      .timer-display {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="timer-card">
      <!-- Mode Selector -->
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="session">Session</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
        <button class="mode-btn" data-mode="custom">Custom</button>
      </div>

      <!-- 4 Independent Timers Grid -->
      <div class="timers-grid">
        <!-- Session Timer -->
        <div class="timer-unit">

          <div class="timer-display" id="sessionDisplay">25:00</div>

            <button class="timer-btn" data-action="start" data-timer="shortBreak">▶ Start</button>
            <button class="timer-btn" data-action="pause" data-timer="shortBreak">⏸ Pause</button>
            <button class="timer-btn" data-action="reset" data-timer="shortBreak">⟳ Reset</button>
          </div>
          <div class="duration-control">
            <label>Set:</label>
            <input type="number" id="shortBreakDuration" min="1" max="99" value="5" step="1">
            <button data-set-duration="shortBreak">Apply</button>
          </div>
          <div class="timer-status" id="shortBreakStatus">Ready</div>
        </div>

        <!-- Long Break Timer -->
        <div class="timer-unit">
          <div class="timer-unit-header longBreak">☕ Long Break</div>
          <div class="timer-display" id="longBreakDisplay">15:00</div>

            <button data-set-duration="custom">Apply</button>
          </div>

      <!-- ORIGINAL ACTION BUTTONS (Start, Reset, Settings) -->

  <!-- Settings Modal with ALL Original Color Options -->

          <h3>Button Colors</h3>

  <script>
    // Timer class for independent timers
    class IndependentTimer {
      constructor(name, displayId, statusId, defaultMinutes) {
        this.name = name;
        this.displayElement = document.getElementById(displayId);
        this.statusElement = document.getElementById(statusId);
        this.currentSeconds = defaultMinutes * 60;
        this.isRunning = false;
        this.interval = null;
        this.defaultMinutes = defaultMinutes;
        this.updateDisplay();
      }

      updateDisplay() {
        if (this.displayElement) {
          const mins = Math.floor(this.currentSeconds / 60);
          const secs = this.currentSeconds % 60;
          this.displayElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
      }

      playAlarm() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const now = audioCtx.currentTime;
          const gain = audioCtx.createGain();
          gain.connect(audioCtx.destination);
          gain.gain.setValueAtTime(0.3, now);
          const osc = audioCtx.createOscillator();
          osc.connect(gain);
          osc.frequency.value = 880;
          osc.type = 'sine';
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.00001, now + 1);
          osc.stop(now + 0.8);
          audioCtx.resume();
        } catch(e) {}
      }

      finish() {
        if (this.interval) {
          clearInterval(this.interval);
          this.interval = null;
        }
        this.isRunning = false;
        if (this.statusElement) this.statusElement.innerText = 'Time\'s Up!';
        this.playAlarm();
        setTimeout(() => {
          if (this.statusElement && this.statusElement.innerText === 'Time\'s Up!') {
            this.statusElement.innerText = 'Ready';
          }
        }, 3000);
      }

      tick() {
        if (this.currentSeconds <= 0) {
          if (this.isRunning) this.finish();
          return;
        }
        this.currentSeconds--;
        this.updateDisplay();
        if (this.currentSeconds === 0) this.finish();
      }

      start() {
        if (this.interval) clearInterval(this.interval);
        this.isRunning = true;
        if (this.statusElement) this.statusElement.innerText = 'Running';
        this.interval = setInterval(() => {
          if (this.isRunning) this.tick();
        }, 1000);
      }

      pause() {
        this.isRunning = false;
        if (this.statusElement) this.statusElement.innerText = 'Paused';
        if (this.interval) {
          clearInterval(this.interval);
          this.interval = null;
        }
      }

      reset() {
        this.pause();
        this.currentSeconds = this.defaultMinutes * 60;
        this.updateDisplay();
        if (this.statusElement) this.statusElement.innerText = 'Ready';
      }

      setDuration(minutes) {
        this.defaultMinutes = minutes;
        if (!this.isRunning) {
          this.currentSeconds = minutes * 60;
          this.updateDisplay();
        }
      }
    }

    // Initialize all 4 timers with ORIGINAL default values
    const sessionTimer = new IndependentTimer('session', 'sessionDisplay', 'sessionStatus', 25);
    const shortBreakTimer = new IndependentTimer('shortBreak', 'shortBreakDisplay', 'shortBreakStatus', 5);
    const longBreakTimer = new IndependentTimer('longBreak', 'longBreakDisplay', 'longBreakStatus', 15);
    const customTimer = new IndependentTimer('custom', 'customDisplay', 'customStatus', 30);

    const timers = {
      session: sessionTimer,
      shortBreak: shortBreakTimer,
      longBreak: longBreakTimer,
      custom: customTimer
    };

    // Set up individual timer buttons
    document.querySelectorAll('.timer-btn[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const timerName = btn.dataset.timer;
        const timer = timers[timerName];
        if (timer) {
          if (action === 'start') timer.start();
          else if (action === 'pause') timer.pause();
          else if (action === 'reset') timer.reset();
        }
      });
    });

    // Set up duration buttons
    document.querySelectorAll('[data-set-duration]').forEach(btn => {
      btn.addEventListener('click', () => {
        const timerName = btn.dataset.setDuration;
        const inputId = `${timerName}Duration`;
        const input = document.getElementById(inputId);
        if (input) {
          const minutes = parseInt(input.value);
          if (!isNaN(minutes) && minutes >= 1 && minutes <= 99) {
            timers[timerName].setDuration(minutes);
          }
        }
      });
    });

    // ORIGINAL Start All button functionality
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseText = document.getElementById('playPauseText');
    let allRunning = false;

    if (playPauseBtn) {
      playPauseBtn.onclick = () => {
        if (allRunning) {
          // Pause all timers
          Object.values(timers).forEach(timer => timer.pause());
          playPauseText.innerText = 'Start All';
          allRunning = false;
        } else {
          // Start all timers
          Object.values(timers).forEach(timer => timer.start());
          playPauseText.innerText = 'Pause All';
          allRunning = true;
        }
      };
    }

    // ORIGINAL Reset All button
    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) {
      resetBtn.onclick = () => {
        Object.values(timers).forEach(timer => timer.reset());
        allRunning = false;
        playPauseText.innerText = 'Start All';
      };
    }

    // Mode selector buttons
    const modeBtns = document.querySelectorAll('.mode-btn');
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ========== TASKS MODULE (ORIGINAL) ==========
    let tasks = [];
    const taskListContainer = document.getElementById('taskListContainer');
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');

    function saveTasks() {
      localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
    }

    function loadTasks() {
      const saved = localStorage.getItem('pomodoro_tasks');
      if (saved) tasks = JSON.parse(saved);
      renderTasks();
    }

    function renderTasks() {
      if (!taskListContainer) return;
      taskListContainer.innerHTML = '';
      
      const incomplete = tasks.filter(t => !t.completed);
      const completed = tasks.filter(t => t.completed);
      const sorted = [...incomplete, ...completed];
      
      if (sorted.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-tasks';
        empty.innerText = 'No tasks yet — add something to focus on';
        taskListContainer.appendChild(empty);
        return;
      }
      
      sorted.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'task-completed' : ''}`;
        
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'task-check';
        check.checked = task.completed;
        check.onchange = () => {
          task.completed = check.checked;
          saveTasks();
          renderTasks();
        };
        
        const text = document.createElement('input');
        text.type = 'text';
        text.className = 'task-text';
        text.value = task.text;
        text.onblur = () => {
          task.text = text.value.trim() || 'Untitled';
          saveTasks();
          renderTasks();
        };
        text.onkeypress = (e) => { if (e.key === 'Enter') text.blur(); };
        
        const del = document.createElement('button');
        del.className = 'delete-task';
        del.innerHTML = '×';
        del.onclick = () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          renderTasks();
        };
        
        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(del);
        taskListContainer.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') return;
      tasks.push({ id: Date.now(), text: text, completed: false });
      saveTasks();
      taskInput.value = '';
      renderTasks();
    }

    if (addTaskBtn) addTaskBtn.onclick = addTask;
    if (taskInput) taskInput.onkeypress = (e) => { if (e.key === 'Enter') addTask(); };

    // ========== SETTINGS MODAL (ORIGINAL with all colors) ==========
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettingsBtn = document.querySelector('.settings-close-btn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');

    let timerTextColor = '#1a2c38';
    let timerBgColor = '#667eea';
    let primaryBtnColor = '#667eea';
    let primaryBtnHoverColor = '#5a67d8';
    let actionBtnColor = '#f2f5f9';
    let actionBtnTextColor = '#1f2e3a';
    let taskTextColor = '#1a2c38';
    let pageBgColor = '#667eea';
    let cardBgColor = '#ffffff';
    let sessionTimeSetting = 25;
    let shortBreakTimeSetting = 5;
    let longBreakTimeSetting = 15;
    let customTimeSetting = 30;

    function loadSettings() {
      const saved = localStorage.getItem('pomodoro_settings');
      if (saved) {
        const settings = JSON.parse(saved);
        timerTextColor = settings.timerTextColor || '#1a2c38';
        timerBgColor = settings.timerBgColor || '#667eea';
        primaryBtnColor = settings.primaryBtnColor || '#667eea';
        primaryBtnHoverColor = settings.primaryBtnHoverColor || '#5a67d8';
        actionBtnColor = settings.actionBtnColor || '#f2f5f9';
        actionBtnTextColor = settings.actionBtnTextColor || '#1f2e3a';
        taskTextColor = settings.taskTextColor || '#1a2c38';
        pageBgColor = settings.pageBgColor || '#667eea';
        cardBgColor = settings.cardBgColor || '#ffffff';
        sessionTimeSetting = settings.sessionTimeSetting || 25;
        shortBreakTimeSetting = settings.shortBreakTimeSetting || 5;
        longBreakTimeSetting = settings.longBreakTimeSetting || 15;
        customTimeSetting = settings.customTimeSetting || 30;
        
        applyColors();
      }
    }

    function applyColors() {
      document.body.style.backgroundColor = pageBgColor;
      document.querySelector('.timer-card').style.backgroundColor = cardBgColor;
      document.querySelectorAll('.timer-display').forEach(el => {
        el.style.color = timerTextColor;
        el.style.backgroundColor = timerBgColor;
      });
      document.querySelectorAll('.task-text, .tasks-header h3').forEach(el => {
        el.style.color = taskTextColor;
      });
      
      const addTaskBtnEl = document.getElementById('addTaskBtn');
      if (addTaskBtnEl) addTaskBtnEl.style.backgroundColor = primaryBtnColor;
      
      const saveBtn = document.getElementById('saveSettingsBtn');
      if (saveBtn) saveBtn.style.backgroundColor = primaryBtnColor;
      
      const style = document.createElement('style');
      style.textContent = `
        .add-task-btn:hover, .settings-save-btn:hover {
          background-color: ${primaryBtnHoverColor} !important;
        }
        .mode-btn.active {
          background-color: ${primaryBtnColor} !important;
        }
        .task-input-field:focus {
          border-color: ${primaryBtnColor} !important;
        }
      `;
      document.head.appendChild(style);
      
      const actionBtns = [playPauseBtn, resetBtn, settingsBtn];
      actionBtns.forEach(btn => {
        if (btn) {
          btn.style.backgroundColor = actionBtnColor;
          btn.style.color = actionBtnTextColor;
        }
      });
    }

    if (settingsBtn) {
      settingsBtn.onclick = () => {
        document.getElementById('timerTextColor').value = timerTextColor;
        document.getElementById('timerBgColor').value = timerBgColor;
        document.getElementById('primaryBtnColor').value = primaryBtnColor;
        document.getElementById('primaryBtnHoverColor').value = primaryBtnHoverColor;
        document.getElementById('actionBtnColor').value = actionBtnColor;
        document.getElementById('actionBtnTextColor').value = actionBtnTextColor;
        document.getElementById('taskTextColor').value = taskTextColor;
        document.getElementById('pageBgColor').value = pageBgColor;
        document.getElementById('cardBgColor').value = cardBgColor;
        settingsOverlay.style.display = 'flex';
      };
    }

    if (closeSettingsBtn) closeSettingsBtn.onclick = () => settingsOverlay.style.display = 'none';
    if (settingsOverlay) settingsOverlay.onclick = (e) => { if (e.target === settingsOverlay) settingsOverlay.style.display = 'none'; };

    if (saveSettingsBtn) {
      saveSettingsBtn.onclick = () => {
        timerTextColor = document.getElementById('timerTextColor').value;
        timerBgColor = document.getElementById('timerBgColor').value;
        primaryBtnColor = document.getElementById('primaryBtnColor').value;
        primaryBtnHoverColor = document.getElementById('primaryBtnHoverColor').value;
        actionBtnColor = document.getElementById('actionBtnColor').value;
        actionBtnTextColor = document.getElementById('actionBtnTextColor').value;
        taskTextColor = document.getElementById('taskTextColor').value;
        pageBgColor = document.getElementById('pageBgColor').value;
        cardBgColor = document.getElementById('cardBgColor').value;
        const alarmSound = document.getElementById('alarmSoundSelect').value;
        
        localStorage.setItem('pomodoro_settings', JSON.stringify({
          timerTextColor, timerBgColor, primaryBtnColor, primaryBtnHoverColor,
          actionBtnColor, actionBtnTextColor, taskTextColor, pageBgColor, cardBgColor, alarmSound
        }));
        
        applyColors();
        settingsOverlay.style.display = 'none';
      };
    }

    loadTasks();
    loadSettings();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pomodoro Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #667eea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .timer-card {
      max-width: 650px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      text-align: center;
    }

    .mode-selector {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: #f0f2f5;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      color: #4a5568;
    }

    .mode-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: #667eea;
      color: white;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .timer-circle {
      text-align: center;
      margin: 1rem 0;
    }

    .timer-digits {
      font-size: 5rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      background: #667eea;
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 80px;
      color: white;
      letter-spacing: 4px;
      transition: all 0.3s ease;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin: 1.5rem 0;
      transition: all 0.3s ease;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: #f2f5f9;
      border: none;
      cursor: pointer;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #1f2e3a;
      font-size: 1rem;
      justify-content: center;
    }

    .btn-icon {
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    .icon-btn:hover {
      background: #e6edf4;
      transform: scale(0.97);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .tasks-section {
      margin-top: 2rem;
      border-top: 2px solid #edeff4;
      padding-top: 1.5rem;
    }

    .tasks-header {
      margin-bottom: 1rem;
      text-align: left;
    }

    .tasks-header h3 {
      font-size: 1.2rem;
      color: #1f2b36;
    }

    .task-input-container {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .task-input-field {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid #cfdee9;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .task-input-field:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .add-task-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .add-task-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    .task-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .task-item {
      background: #f9fbfd;
      border-radius: 0.8rem;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #eef2f6;
    }

    .task-check {
      width: 1.2rem;
      height: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      padding: 0.2rem 0;
      font-family: inherit;
      color: #1a2c38;
      text-align: left;
    }

    .task-text:focus {
      outline: none;
      border-bottom: 1px dashed #667eea;
    }

    .task-completed .task-text {
      text-decoration: line-through;
      color: #8ba0ae;
    }

    .delete-task {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #9aaebf;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .delete-task:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .empty-tasks {
      padding: 1.5rem;
      text-align: center;
      color: #93a9bb;
      font-size: 0.85rem;
      background: #fbfdff;
      border-radius: 0.8rem;
      border: 1px dashed #dce5ec;
    }

    /* Settings Modal */
    .settings-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .settings-modal {
      background: white;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-modal-header h2 {
      font-size: 1.3rem;
      color: #1f2b36;
    }

    .settings-close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #93a9bb;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .settings-close-btn:hover {
      color: #cc5a5a;
      background: #fff0f0;
    }

    .settings-modal-body {
      padding: 1.5rem;
    }

    .settings-group {
      margin-bottom: 1.8rem;
    }

    .settings-group h3 {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid #edeff4;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .settings-row label {
      font-weight: 500;
      color: #2d3748;
      font-size: 0.9rem;
      min-width: 140px;
    }

    .settings-row input {
      width: 100px;
      padding: 0.5rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-row input[type="color"] {
      width: 70px;
      height: 40px;
      cursor: pointer;
    }

    .settings-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cfdee9;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }

    .settings-modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #edeff4;
      display: flex;
      justify-content: flex-end;
    }

    .settings-save-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .settings-save-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    /* ========== RESPONSIVE DESIGN - BUTTONS GET SMALLER AND STACK ========== */
    
    /* Tablet (768px and below) */
    @media (max-width: 768px) {
      .timer-card {
        padding: 1.5rem;
      }
      
      .timer-digits {
        font-size: 3.5rem;
        padding: 0.4rem 1.2rem;
      }
      
      .mode-btn {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
      }
      
      .action-buttons {
        gap: 1rem;
      }
      
      .icon-btn {
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }
      
      .btn-icon {
        font-size: 1rem;
      }
    }
    
    /* Mobile (650px and below) - buttons stack and get smaller */
    @media (max-width: 650px) {
      .action-buttons {
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
      }
      
      .icon-btn {
        width: auto;
        min-width: 140px;
        padding: 0.6rem 1.1rem;
        font-size: 0.85rem;
      }
      
      .btn-icon {
        font-size: 0.95rem;
      }
    }
    
    /* Small Mobile (550px and below) - buttons get even smaller */
    @media (max-width: 550px) {
      .timer-card {
        padding: 1.2rem;
      }
      
      .timer-digits {
        font-size: 3rem;
        padding: 0.35rem 1rem;
      }
      
      .mode-selector {
        gap: 0.5rem;
      }
      
      .mode-btn {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
      }
      
      .icon-btn {
        min-width: 120px;
        padding: 0.55rem 1rem;
        font-size: 0.8rem;
      }
      
      .btn-icon {
        font-size: 0.9rem;
      }
      
      .task-input-container {
        flex-direction: column;
        gap: 0.8rem;
      }
      
      .add-task-btn {
        width: 100%;
        padding: 0.6rem;
        font-size: 0.85rem;
      }
    }
    
    /* Mobile (480px and below) - even smaller buttons */
    @media (max-width: 480px) {
      .timer-digits {
        font-size: 2.5rem;
        padding: 0.3rem 0.9rem;
        letter-spacing: 2px;
      }
      
      .icon-btn {
        min-width: 110px;
        padding: 0.5rem 0.9rem;
        font-size: 0.75rem;
        gap: 6px;
      }
      
      .btn-icon {
        font-size: 0.85rem;
      }
      
      .mode-btn {
        padding: 0.35rem 0.7rem;
        font-size: 0.75rem;
      }
      
      .settings-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
      
      .settings-row input {
        width: 100%;
      }
    }
    
    /* Extra Small (400px and below) - smallest buttons */
    @media (max-width: 400px) {
      .timer-digits {
        font-size: 2rem;
        padding: 0.25rem 0.7rem;
        letter-spacing: 1px;
      }
      
      .icon-btn {
        min-width: 100px;
        padding: 0.45rem 0.8rem;
        font-size: 0.7rem;
        gap: 5px;
      }
      
      .btn-icon {
        font-size: 0.8rem;
      }
      
      .mode-btn {
        padding: 0.3rem 0.6rem;
        font-size: 0.7rem;
      }
      
      .task-input-field {
        padding: 0.5rem 0.7rem;
        font-size: 0.8rem;
      }
      
      .add-task-btn {
        padding: 0.5rem 0.8rem;
        font-size: 0.8rem;
      }
      
      .task-text {
        font-size: 0.8rem;
      }
    }
    
    /* Tiny (340px and below) */
    @media (max-width: 340px) {
      .icon-btn {
        min-width: 90px;
        padding: 0.4rem 0.7rem;
        font-size: 0.65rem;
      }
      
      .btn-icon {
        font-size: 0.75rem;
      }
      
      .timer-digits {
        font-size: 1.8rem;
        padding: 0.2rem 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="timer-card">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="session">Session</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
        <button class="mode-btn" data-mode="custom">Custom</button>
      </div>

      <div class="timer-circle">
        <div class="timer-digits" id="timerDisplay">25:00</div>
      </div>

      <div class="action-buttons">
        <button class="icon-btn" id="playPauseBtn">
          <span class="btn-icon">▶</span>
          <span id="playPauseText">Start</span>
        </button>
        <button class="icon-btn" id="resetBtn">
          <span class="btn-icon">⟳</span>
          <span>Reset</span>
        </button>
        <button class="icon-btn" id="settingsBtn">
          <span class="btn-icon">⚙</span>
          <span>Settings</span>
        </button>
      </div>

      <div class="tasks-section">
        <div class="tasks-header">
          <h3>Tasks</h3>
        </div>
        <div class="task-input-container">
          <input type="text" id="taskInput" placeholder="Enter a new task..." class="task-input-field">
          <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
        </div>
        <ul class="task-list" id="taskListContainer">
          <li class="empty-tasks">No tasks yet — add something to focus on</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsOverlay" class="settings-overlay">
    <div class="settings-modal">
      <div class="settings-modal-header">
        <h2>Settings</h2>
        <button class="settings-close-btn">&times;</button>
      </div>
      <div class="settings-modal-body">
        <div class="settings-group">
          <h3>Timer Duration (minutes)</h3>
          <div class="settings-row">
            <label>Session Time:</label>
            <input type="number" id="sessionTime" min="1" max="99" value="25">
          </div>
          <div class="settings-row">
            <label>Short Break:</label>
            <input type="number" id="shortBreakTime" min="1" max="99" value="5">
          </div>
          <div class="settings-row">
            <label>Long Break:</label>
            <input type="number" id="longBreakTime" min="1" max="99" value="15">
          </div>
          <div class="settings-row">
            <label>Custom Time:</label>
            <input type="number" id="customTime" min="1" max="99" value="30">
          </div>
        </div>

        <div class="settings-group">
          <h3>Timer Colors</h3>
          <div class="settings-row">
            <label>Timer Text Color:</label>
            <input type="color" id="timerTextColor" value="#ffffff">
          </div>
          <div class="settings-row">
            <label>Timer Background:</label>
            <input type="color" id="timerBgColor" value="#667eea">
          </div>
        </div>

        <div class="settings-group">
          <h3>Button Colors</h3>
          <div class="settings-row">
            <label>Primary Button Color:</label>
            <input type="color" id="primaryBtnColor" value="#667eea">
          </div>
          <div class="settings-row">
            <label>Primary Button Hover:</label>
            <input type="color" id="primaryBtnHoverColor" value="#5a67d8">
          </div>
          <div class="settings-row">
            <label>Action Button Color:</label>
            <input type="color" id="actionBtnColor" value="#f2f5f9">
          </div>
          <div class="settings-row">
            <label>Action Button Text:</label>
            <input type="color" id="actionBtnTextColor" value="#1f2e3a">
          </div>
        </div>

        <div class="settings-group">
          <h3>Theme Colors</h3>
          <div class="settings-row">
            <label>Task Text Color:</label>
            <input type="color" id="taskTextColor" value="#1a2c38">
          </div>
          <div class="settings-row">
            <label>Page Background:</label>
            <input type="color" id="pageBgColor" value="#667eea">
          </div>
          <div class="settings-row">
            <label>Card Background:</label>
            <input type="color" id="cardBgColor" value="#ffffff">
          </div>
        </div>

        <div class="settings-group">
          <h3>Alarm Sound</h3>
          <select id="alarmSoundSelect">
            <option value="Egg Timer Vibes">Egg Timer Vibes</option>
            <option value="Flow">Flow</option>
            <option value="iPhone Note">iPhone Note</option>
            <option value="Clear Tone">Clear Tone</option>
            <option value="LG Note">LG Note</option>
            <option value="Telegram Note">Telegram Note</option>
            <option value="Spongebob Note">Spongebob Note</option>
            <option value="Message Tones">Message Tones</option>
          </select>
        </div>
      </div>
      <div class="settings-modal-footer">
        <button class="settings-save-btn" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      function init() {
        const timerDisplay = document.getElementById('timerDisplay');
        const playPauseText = document.getElementById('playPauseText');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const closeSettingsBtn = document.querySelector('.settings-close-btn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskListContainer = document.getElementById('taskListContainer');
        
        let timerInterval = null;
        let currentSeconds = 25 * 60;
        let isRunning = false;
        let currentMode = 'session';
        let sessionTime = 25;
        let shortBreakTime = 5;
        let longBreakTime = 15;
        let customTime = 30;
        let tasks = [];
        
        // Color values
        let timerTextColor = '#ffffff';
        let timerBgColor = '#667eea';
        let primaryBtnColor = '#667eea';
        let primaryBtnHoverColor = '#5a67d8';
        let actionBtnColor = '#f2f5f9';
        let actionBtnTextColor = '#1f2e3a';
        let taskTextColor = '#1a2c38';
        let pageBgColor = '#667eea';
        let cardBgColor = '#ffffff';
        
        function loadSavedData() {
          const savedTimer = localStorage.getItem('pomodoro_timer');
          if (savedTimer) {
            const data = JSON.parse(savedTimer);
            currentSeconds = data.currentSeconds || 25 * 60;
            currentMode = data.currentMode || 'session';
            sessionTime = data.sessionTime || 25;
            shortBreakTime = data.shortBreakTime || 5;
            longBreakTime = data.longBreakTime || 15;
            customTime = data.customTime || 30;
          }
          
          const savedTasks = localStorage.getItem('pomodoro_tasks');
          if (savedTasks) {
            tasks = JSON.parse(savedTasks);
          }
          
          const savedSettings = localStorage.getItem('pomodoro_settings');
          if (savedSettings) {
            const settings = JSON.parse(savedSettings);
            sessionTime = settings.sessionTime || 25;
            shortBreakTime = settings.shortBreakTime || 5;
            longBreakTime = settings.longBreakTime || 15;
            customTime = settings.customTime || 30;
            timerTextColor = settings.timerTextColor || '#ffffff';
            timerBgColor = settings.timerBgColor || '#667eea';
            primaryBtnColor = settings.primaryBtnColor || '#667eea';
            primaryBtnHoverColor = settings.primaryBtnHoverColor || '#5a67d8';
            actionBtnColor = settings.actionBtnColor || '#f2f5f9';
            actionBtnTextColor = settings.actionBtnTextColor || '#1f2e3a';
            taskTextColor = settings.taskTextColor || '#1a2c38';
            pageBgColor = settings.pageBgColor || '#667eea';
            cardBgColor = settings.cardBgColor || '#ffffff';
          }
          
          applyColors();
        }
        
        function applyColors() {
          document.body.style.backgroundColor = pageBgColor;
          document.querySelector('.timer-card').style.backgroundColor = cardBgColor;
          timerDisplay.style.color = timerTextColor;
          timerDisplay.style.backgroundColor = timerBgColor;
          
          document.querySelectorAll('.task-text, .tasks-header h3').forEach(el => {
            el.style.color = taskTextColor;
          });
          
          if (addTaskBtn) {
            addTaskBtn.style.backgroundColor = primaryBtnColor;
          }
          if (saveSettingsBtn) {
            saveSettingsBtn.style.backgroundColor = primaryBtnColor;
          }
          
          const style = document.createElement('style');
          style.textContent = `
            .add-task-btn:hover, .settings-save-btn:hover {
              background-color: ${primaryBtnHoverColor} !important;
            }
            .mode-btn.active {
              background-color: ${primaryBtnColor} !important;
            }
            .task-input-field:focus {
              border-color: ${primaryBtnColor} !important;
            }
          `;
          document.head.appendChild(style);
          
          const actionBtns = [playPauseBtn, resetBtn, settingsBtn];
          actionBtns.forEach(btn => {
            if (btn) {
              btn.style.backgroundColor = actionBtnColor;
              btn.style.color = actionBtnTextColor;
            }
          });
        }
        
        function saveTimerState() {
          localStorage.setItem('pomodoro_timer', JSON.stringify({
            currentSeconds: currentSeconds,
            currentMode: currentMode,
            sessionTime: sessionTime,
            shortBreakTime: shortBreakTime,
            longBreakTime: longBreakTime,
            customTime: customTime
          }));
        }
        
        function saveTasks() {
          localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
        }
        
        function updateDisplay() {
          const mins = Math.floor(currentSeconds / 60);
          const secs = currentSeconds % 60;
          timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function playAlarm() {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.3, now);
            const osc = audioCtx.createOscillator();
            osc.connect(gain);
            osc.frequency.value = 880;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 1);
            osc.stop(now + 0.8);
            audioCtx.resume();
          } catch(e) {}
        }
        
        function finishTimer() {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          isRunning = false;
          playPauseText.innerText = 'Start';
          playAlarm();
          saveTimerState();
        }
        
        function tick() {
          if (currentSeconds <= 0) {
            if (isRunning) finishTimer();
            return;
          }
          currentSeconds--;
          updateDisplay();
          if (currentSeconds === 0) finishTimer();
          saveTimerState();
        }
        
        function startTimer() {
          if (timerInterval) clearInterval(timerInterval);
          isRunning = true;
          playPauseText.innerText = 'Pause';
          timerInterval = setInterval(() => {
            if (isRunning) tick();
          }, 1000);
          saveTimerState();
        }
        
        function pauseTimer() {
          isRunning = false;
          playPauseText.innerText = 'Start';
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          saveTimerState();
        }
        
        function resetTimer() {
          pauseTimer();
          setMode(currentMode);
        }
        
        function setMode(mode) {
          currentMode = mode;
          let duration = sessionTime;
          switch(mode) {
            case 'session': duration = sessionTime; break;
            case 'shortBreak': duration = shortBreakTime; break;
            case 'longBreak': duration = longBreakTime; break;
            case 'custom': duration = customTime; break;
          }
          currentSeconds = duration * 60;
          updateDisplay();
          playPauseText.innerText = 'Start';
          isRunning = false;
          
          modeBtns.forEach(btn => {
            if (btn.dataset.mode === mode) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
          saveTimerState();
        }
        
        function renderTasks() {
          if (!taskListContainer) return;
          taskListContainer.innerHTML = '';
          
          const incomplete = tasks.filter(t => !t.completed);
          const completed = tasks.filter(t => t.completed);
          const sorted = [...incomplete, ...completed];
          
          if (sorted.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'empty-tasks';
            empty.innerText = 'No tasks yet — add something to focus on';
            taskListContainer.appendChild(empty);
            return;
          }
          
          sorted.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'task-completed' : ''}`;
            
            const check = document.createElement('input');
            check.type = 'checkbox';
            check.className = 'task-check';
            check.checked = task.completed;
            check.onchange = () => {
              task.completed = check.checked;
              saveTasks();
              renderTasks();
            };
            
            const text = document.createElement('input');
            text.type = 'text';
            text.className = 'task-text';
            text.value = task.text;
            text.style.color = taskTextColor;
            text.onblur = () => {
              task.text = text.value.trim() || 'Untitled';
              saveTasks();
              renderTasks();
            };
            text.onkeypress = (e) => { if (e.key === 'Enter') text.blur(); };
            
            const del = document.createElement('button');
            del.className = 'delete-task';
            del.innerHTML = '×';
            del.onclick = () => {
              tasks = tasks.filter(t => t.id !== task.id);
              saveTasks();
              renderTasks();
            };
            
            li.appendChild(check);
            li.appendChild(text);
            li.appendChild(del);
            taskListContainer.appendChild(li);
          });
        }
        
        function addTask() {
          const text = taskInput.value.trim();
          if (text === '') return;
          tasks.push({ id: Date.now(), text: text, completed: false });
          saveTasks();
          taskInput.value = '';
          renderTasks();
        }
        
        // Event Listeners
        if (playPauseBtn) {
          playPauseBtn.onclick = function() {
            if (isRunning) pauseTimer();
            else startTimer();
          };
        }
        
        if (resetBtn) resetBtn.onclick = resetTimer;
        
        if (settingsBtn) {
          settingsBtn.onclick = function() {
            document.getElementById('sessionTime').value = sessionTime;
            document.getElementById('shortBreakTime').value = shortBreakTime;
            document.getElementById('longBreakTime').value = longBreakTime;
            document.getElementById('customTime').value = customTime;
            document.getElementById('timerTextColor').value = timerTextColor;
            document.getElementById('timerBgColor').value = timerBgColor;
            document.getElementById('primaryBtnColor').value = primaryBtnColor;
            document.getElementById('primaryBtnHoverColor').value = primaryBtnHoverColor;
            document.getElementById('actionBtnColor').value = actionBtnColor;
            document.getElementById('actionBtnTextColor').value = actionBtnTextColor;
            document.getElementById('taskTextColor').value = taskTextColor;
            document.getElementById('pageBgColor').value = pageBgColor;
            document.getElementById('cardBgColor').value = cardBgColor;
            settingsOverlay.style.display = 'flex';
          };
        }
        
        if (closeSettingsBtn) {
          closeSettingsBtn.onclick = function() {
            settingsOverlay.style.display = 'none';
          };
        }
        
        if (settingsOverlay) {
          settingsOverlay.onclick = function(e) {
            if (e.target === settingsOverlay) settingsOverlay.style.display = 'none';
          };
        }
        
        if (saveSettingsBtn) {
          saveSettingsBtn.onclick = function() {
            sessionTime = parseInt(document.getElementById('sessionTime').value) || 25;
            shortBreakTime = parseInt(document.getElementById('shortBreakTime').value) || 5;
            longBreakTime = parseInt(document.getElementById('longBreakTime').value) || 15;
            customTime = parseInt(document.getElementById('customTime').value) || 30;
            
            timerTextColor = document.getElementById('timerTextColor').value;
            timerBgColor = document.getElementById('timerBgColor').value;
            primaryBtnColor = document.getElementById('primaryBtnColor').value;
            primaryBtnHoverColor = document.getElementById('primaryBtnHoverColor').value;
            actionBtnColor = document.getElementById('actionBtnColor').value;
            actionBtnTextColor = document.getElementById('actionBtnTextColor').value;
            taskTextColor = document.getElementById('taskTextColor').value;
            pageBgColor = document.getElementById('pageBgColor').value;
            cardBgColor = document.getElementById('cardBgColor').value;
            const alarmSound = document.getElementById('alarmSoundSelect').value;
            
            localStorage.setItem('pomodoro_settings', JSON.stringify({
              sessionTime, shortBreakTime, longBreakTime, customTime,
              timerTextColor, timerBgColor,
              primaryBtnColor, primaryBtnHoverColor, actionBtnColor, actionBtnTextColor,
              taskTextColor, pageBgColor, cardBgColor, alarmSound
            }));
            
            applyColors();
            setMode(currentMode);
            renderTasks();
            settingsOverlay.style.display = 'none';
          };
        }
        
        modeBtns.forEach(btn => {
          btn.onclick = function() {
            setMode(this.dataset.mode);
          };
        });
        
        if (addTaskBtn) addTaskBtn.onclick = addTask;
        if (taskInput) {
          taskInput.onkeypress = function(e) {
            if (e.key === 'Enter') addTask();
          };
        }
        
        loadSavedData();
        setMode(currentMode);
        renderTasks();
      }
    })();
  </script>
</body>
</html>
